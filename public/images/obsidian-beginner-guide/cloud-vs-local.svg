<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14121f"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>

    <!-- Glassmorphism Card Gradients -->
    <linearGradient id="cloudCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="localCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cloudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ff7b72" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="localBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Accent Gradients -->
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4433"/>
      <stop offset="100%" stop-color="#ff7b72"/>
    </linearGradient>
    <linearGradient id="localGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.05">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- TITLE -->
  <text x="400" y="45" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">云端笔记 vs 本地知识库 (Obsidian)</text>
  <text x="400" y="68" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">为什么 Obsidian 更适合作为 AI 时代的第二大脑？</text>

  <!-- LEFT: CLOUD NOTES -->
  <g transform="translate(60, 95)">
    <!-- Card Base -->
    <rect width="310" height="300" rx="16" fill="url(#cloudCardGrad)" stroke="url(#cloudBorder)" stroke-width="1.5"/>
    <text x="155" y="32" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ff7b72" text-anchor="middle">云端笔记 (如 Notion / 某道)</text>

    <!-- User Web/App -->
    <rect x="30" y="60" width="100" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="80" y="85" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">用户客户端</text>

    <!-- AI Agent (Web Dialog) -->
    <rect x="180" y="60" width="100" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="230" y="85" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">网页端 AI (沙盒)</text>

    <!-- Connectors to Cloud -->
    <path d="M 80,100 L 80,135 C 80,155 125,155 125,170" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <path d="M 230,100 L 230,135 C 230,155 185,155 185,170" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Cloud Database Cage (Server) -->
    <g transform="translate(105, 175)">
      <!-- Cloud Outline -->
      <path d="M 25,50 a 25,25 0 0 1 25,-25 a 30,30 0 0 1 55,-10 a 25,25 0 0 1 20,45 a 10,10 0 0 1 -10,10 L 25,70 a 20,20 0 0 1 0,-40 z" fill="#1f1b24" stroke="url(#cloudGlow)" stroke-width="2" filter="url(#glow)"/>
      <!-- Database cylinder inside -->
      <rect x="42" y="32" width="18" height="24" rx="2" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
      <line x1="42" y1="40" x2="60" y2="40" stroke="#ff7b72" stroke-width="1.5"/>
      <line x1="42" y1="48" x2="60" y2="48" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="75" y="48" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ff7b72">云端数据库</text>
    </g>

    <!-- Text explanations -->
    <text x="155" y="275" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">❌ 数据存在云端，格式被数据库锁定</text>
    <text x="155" y="292" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">❌ 本地 AI 无法直接读写，必须不断复制粘贴</text>
  </g>

  <!-- RIGHT: LOCAL OBSIDIAN KNOWLEDGE BASE -->
  <g transform="translate(430, 95)">
    <!-- Card Base -->
    <rect width="310" height="300" rx="16" fill="url(#localCardGrad)" stroke="url(#localBorder)" stroke-width="1.5"/>
    <text x="155" y="32" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#bc8cff" text-anchor="middle">Obsidian 本地知识库</text>

    <!-- User Obsidian App -->
    <rect x="30" y="60" width="100" height="40" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="80" y="85" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Obsidian 软件</text>

    <!-- AI Agent (Codex/Claude Code) -->
    <rect x="180" y="60" width="100" height="40" rx="8" fill="#1f1530" stroke="#bc8cff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="230" y="85" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">本地 AI 助手</text>
    
    <!-- Active arrows to local files -->
    <!-- Curved line from Obsidian to folder -->
    <path d="M 80,100 Q 80,180 120,180" fill="none" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Curved line from AI Agent to folder -->
    <path d="M 230,100 Q 230,180 190,180" fill="none" stroke="#bc8cff" stroke-width="2"/>
    
    <!-- Visual Indicator of both accessing the folder -->
    <circle cx="155" cy="180" r="4" fill="#ffffff" filter="url(#glow)"/>

    <!-- Local Folder (.md Markdown files) -->
    <g transform="translate(115, 155)">
      <!-- Folder base -->
      <path d="M 10,15 L 30,15 L 38,25 L 70,25 L 70,55 L 10,55 Z" fill="#161b22" stroke="url(#localGlow)" stroke-width="2" filter="url(#glow)"/>
      <text x="40" y="42" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">.md 文件夹</text>
      
      <!-- Mini markdown files peeking out -->
      <rect x="52" y="-2" width="16" height="20" rx="1" fill="#21262d" stroke="#58a6ff" stroke-width="1" transform="rotate(15 60 10)"/>
      <rect x="58" y="2" width="16" height="20" rx="1" fill="#1f1530" stroke="#bc8cff" stroke-width="1" transform="rotate(25 66 12)"/>
    </g>

    <!-- Text explanations -->
    <text x="155" y="275" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">      数据完全属于你，永远不会丢失</text>
    <circle cx="28" cy="271" r="2.5" fill="#bc8cff"/>
    <text x="155" y="292" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">      本地 AI 可以直接读写，无缝协同自动化</text>
    <circle cx="15" cy="288" r="2.5" fill="#bc8cff"/>
  </g>

  <!-- Connective arrow in center (or barrier) -->
  <line x1="400" y1="120" x2="400" y2="350" stroke="#30363d" stroke-dasharray="5 5" stroke-width="1"/>
</svg>
