<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121020"/>
      <stop offset="100%" stop-color="#08060c"/>
    </radialGradient>

    <!-- Glassmorphic Gradients -->
    <linearGradient id="glowWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glowLocal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Border Lines -->
    <linearGradient id="borderWeb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="borderLocal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- TITLE -->
  <text x="400" y="38" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI 协同工作流对比</text>
  <text x="400" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">网页对话框 vs 本地 Agent 直接读写</text>

  <!-- PANEL 1: TRADITIONAL WEB AI WORKFLOW (TOP) -->
  <g transform="translate(50, 85)">
    <!-- Container Base -->
    <rect width="700" height="150" rx="12" fill="url(#glowWeb)" stroke="url(#borderWeb)" stroke-width="1.5"/>
    <text x="25" y="25" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ff7b72">传统网页对话框工作流（繁琐低效）</text>

    <!-- Steps -->
    <!-- Node 1: Local editor -->
    <rect x="40" y="50" width="110" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="95" y="75" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">本地笔记文件</text>
    <text x="95" y="92" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">有想法或草稿</text>

    <!-- Arrow 1: Manual Copy -->
    <path d="M 160,78 L 240,78" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="200" y="70" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ff7b72" text-anchor="middle">1. 手动全选复制</text>

    <!-- Node 2: Web Chatbot -->
    <rect x="250" y="50" width="160" height="55" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="1" filter="url(#glow)"/>
    <text x="330" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">网页端 AI (如 ChatGPT)</text>
    <text x="330" y="89" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">在对话框粘贴、写提示词</text>

    <!-- Arrow 2: Wait & Copy back -->
    <path d="M 420,78 L 500,78" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="460" y="70" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ff7b72" text-anchor="middle">2. 生成完毕复制</text>

    <!-- Node 3: Back to Local -->
    <rect x="510" y="50" width="150" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="585" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">新建/覆盖本地笔记</text>
    <text x="585" y="89" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">再次粘贴，手动排版</text>

    <!-- Status Badge -->
    <rect x="590" y="115" width="70" height="18" rx="9" fill="#ff7b72" fill-opacity="0.1"/>
    <text x="625" y="128" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ff7b72" text-anchor="middle">多次复制粘贴</text>
  </g>

  <!-- PANEL 2: OBSIDIAN + LOCAL AGENT WORKFLOW (BOTTOM) -->
  <g transform="translate(50, 255)">
    <!-- Container Base -->
    <rect width="700" height="150" rx="12" fill="url(#glowLocal)" stroke="url(#borderLocal)" stroke-width="1.5"/>
    <text x="25" y="25" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#79c0ff">Obsidian + 本地 AI Agent 工作流（一键触达）</text>

    <!-- Local Folder (Obsidian Vault) -->
    <rect x="40" y="50" width="180" height="75" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="130" y="72" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Obsidian 本地文件夹</text>
    <text x="130" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">文件1.md, 文件2.md ...</text>
    <text x="130" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">（所有数据本地敞开）</text>

    <!-- Direct connection lines -->
    <!-- Curved Bi-directional arrow -->
    <path d="M 230,88 L 470,88" fill="none" stroke="url(#borderLocal)" stroke-width="3" filter="url(#glow)"/>
    <text x="350" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">AI 直接读取 / 修改 / 写入文件</text>
    <text x="350" y="105" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">零摩擦，不经过剪贴板</text>

    <!-- Local Agent (Codex / Claude Code CLI) -->
    <rect x="480" y="50" width="180" height="75" rx="8" fill="#1f1530" stroke="#bc8cff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="570" y="72" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">本地 AI (Claude Code / Codex)</text>
    <text x="570" y="90" font-family="'Segoe UI', sans-serif" font-size="10" fill="#d2a8ff" text-anchor="middle">运行于当前文件夹终端</text>
    <text x="570" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">“帮我写个选题，保存为新笔记”</text>

    <!-- Status Badge -->
    <rect x="40" y="15" width="70" height="18" rx="9" fill="#58a6ff" fill-opacity="0.1" transform="translate(615, 0)"/>
    <text x="690" y="28" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#58a6ff" text-anchor="middle">极简自动化</text>
  </g>
  
  <!-- Arrow definitions -->
  <svg>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
      </marker>
    </defs>
  </svg>
</svg>
