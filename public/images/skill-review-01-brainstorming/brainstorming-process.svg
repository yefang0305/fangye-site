<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (White/Light) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    
    <!-- Flow Connector Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Card Backgrounds (Light) -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 700; fill: #0f172a; font-size: 22px; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; fill: #475569; font-size: 13px; text-anchor: middle; }
    .step-num { font-family: 'Impact', sans-serif; font-size: 56px; fill: #0284c7; opacity: 0.08; }
    .step-title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 600; font-size: 16px; fill: #0f172a; }
    .step-desc { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-size: 12px; fill: #475569; }
    .bubble-text-ai { font-family: system-ui, sans-serif; font-size: 10px; fill: #1e293b; }
    .bubble-text-user { font-family: system-ui, sans-serif; font-size: 10px; fill: #ffffff; }
    .node-text { font-family: system-ui, sans-serif; font-size: 10px; fill: #334155; }
    .badge { font-family: system-ui, sans-serif; font-size: 9px; font-weight: bold; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="800" height="380" fill="url(#bg-grad)" rx="16"/>

  <!-- Header -->
  <text x="400" y="45" class="title">Brainstorming Skill 的三大核心步骤</text>
  <text x="400" y="70" class="subtitle">逐一提问厘清细节 ➔ 多案对比确定方向 ➔ 渐进式结构确认</text>

  <!-- Flow Connectors -->
  <!-- Step 1 to 2 -->
  <path d="M250,210 L290,210" fill="none" stroke="url(#arrow-grad)" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <!-- Step 2 to 3 -->
  <path d="M510,210 L550,210" fill="none" stroke="url(#arrow-grad)" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Step 1: 逐一提问 -->
  <g transform="translate(30, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Modern Step Number as Background -->
    <text x="200" y="55" class="step-num" text-anchor="end">01</text>
    <!-- Left-aligned Header -->
    <text x="20" y="32" class="step-title">逐一提问</text>
    <text x="20" y="54" class="step-desc">单次只答一问，告别填表压力</text>
    
    <!-- Mini Graphic: Q&A bubbles -->
    <g transform="translate(20, 80)">
      <!-- Bubble 1 (AI) -->
      <rect x="5" y="10" width="150" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <polygon points="5,20 0,24 5,28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <rect x="4" y="20" width="3" height="8" fill="#f1f5f9" /> <!-- Mask connection line -->
      <text x="15" y="24" class="bubble-text-ai" dominant-baseline="central">“读者是新手还是老手？”</text>

      <!-- Bubble 2 (User) -->
      <rect x="25" y="50" width="150" height="28" rx="6" fill="#0284c7" />
      <polygon points="175,60 180,64 175,68" fill="#0284c7" />
      <text x="35" y="64" class="bubble-text-user" dominant-baseline="central">“想多照顾一下新手”</text>

      <!-- Bubble 3 (AI) -->
      <rect x="5" y="90" width="150" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <polygon points="5,100 0,104 5,108" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <rect x="4" y="100" width="3" height="8" fill="#f1f5f9" /> <!-- Mask connection line -->
      <text x="15" y="104" class="bubble-text-ai" dominant-baseline="central">“文章的核心切入点是？”</text>
    </g>
  </g>

  <!-- Step 2: 方案选择 -->
  <g transform="translate(290, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card-grad)" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Modern Step Number as Background -->
    <text x="200" y="55" class="step-num" text-anchor="end">02</text>
    <!-- Left-aligned Header -->
    <text x="20" y="32" class="step-title">多方案选择</text>
    <text x="20" y="54" class="step-desc">提供多条路径，并给出优缺点</text>
    
    <!-- Mini Graphic: Decision Tree -->
    <g transform="translate(20, 80)">
      <!-- Main node -->
      <rect x="60" y="5" width="60" height="20" rx="4" fill="#f8fafc" stroke="#64748b" />
      <text x="90" y="15" class="node-text" text-anchor="middle" font-weight="bold" dominant-baseline="central">生成方案</text>

      <!-- Branches -->
      <path d="M90,25 L30,55 M90,25 L90,55 M90,25 L150,55" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      
      <!-- Option A -->
      <rect x="5" y="55" width="50" height="20" rx="3" fill="#ffffff" stroke="#f43f5e" />
      <text x="30" y="65" class="node-text" text-anchor="middle" dominant-baseline="central">A. 纯实操</text>

      <!-- Option B (Recommended) -->
      <rect x="65" y="55" width="50" height="20" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
      <text x="90" y="65" class="node-text" text-anchor="middle" font-weight="bold" dominant-baseline="central">B. 案例型</text>
      <!-- Recommendation Badge aligned to B center -->
      <rect x="79" y="48" width="22" height="10" rx="2" fill="#10b981" />
      <text x="90" y="53" class="badge" text-anchor="middle" dominant-baseline="central">推荐</text>
      
      <!-- Option C -->
      <rect x="125" y="55" width="50" height="20" rx="3" fill="#ffffff" stroke="#a855f7" />
      <text x="150" y="65" class="node-text" text-anchor="middle" dominant-baseline="central">C. 概念流</text>

      <!-- Selected Route highlighting -->
      <path d="M90,25 L90,55" fill="none" stroke="#10b981" stroke-width="2" />

      <!-- Pros and Cons snippet -->
      <rect x="20" y="95" width="140" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="30" y="103" class="node-text" font-size="9" fill="#047857" dominant-baseline="central">🟢 优点：读者代入感极强</text>
      <text x="30" y="117" class="node-text" font-size="9" fill="#be123c" dominant-baseline="central">🔴 缺点：写作耗时较长</text>
    </g>
  </g>

  <!-- Step 3: 分段确认 -->
  <g transform="translate(550, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Modern Step Number as Background -->
    <text x="200" y="55" class="step-num" text-anchor="end">03</text>
    <!-- Left-aligned Header -->
    <text x="20" y="32" class="step-title">分段确认</text>
    <text x="20" y="54" class="step-desc">确认大纲细节，防止一次性偏轨</text>
    
    <!-- Mini Graphic: Outline Stack -->
    <g transform="translate(20, 80)">
      <!-- Outline Block 1 -->
      <rect x="10" y="10" width="160" height="28" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
      <text x="22" y="24" class="node-text" fill="#15803d" font-weight="bold" dominant-baseline="central">第一部分：痛点切入</text>
      <circle cx="150" cy="24" r="7" fill="#10b981" />
      <path d="M147,24 L149,26 L153,22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Outline Block 2 -->
      <rect x="10" y="48" width="160" height="28" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
      <text x="22" y="62" class="node-text" fill="#15803d" font-weight="bold" dominant-baseline="central">第二部分：概念引入</text>
      <circle cx="150" cy="62" r="7" fill="#10b981" />
      <path d="M147,62 L149,64 L153,60" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Outline Block 3 (Under Edit/Interactive) -->
      <rect x="10" y="86" width="160" height="28" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" />
      <text x="22" y="100" class="node-text" fill="#a16207" font-weight="bold" dominant-baseline="central">第三部分：实操步骤？</text>
      <circle cx="150" cy="100" r="7" fill="#eab308" />
      <text x="150" y="100" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">?</text>
    </g>
  </g>
</svg>
