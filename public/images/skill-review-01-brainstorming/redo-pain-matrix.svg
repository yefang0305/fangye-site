<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (White/Light) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Quadrant Gradients (Light) -->
    <!-- Brainstorming Zone (Top-Left) -->
    <linearGradient id="q-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    
    <!-- Direct Action Zone (Bottom-Right) -->
    <linearGradient id="q-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Double Check Zone (Top-Right) -->
    <linearGradient id="q-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Prototyping Zone (Bottom-Left) -->
    <linearGradient id="q-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 700; fill: #0f172a; font-size: 22px; text-anchor: middle; }
    .subtitle { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; fill: #475569; font-size: 13px; text-anchor: middle; }
    .axis-arrow-text { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: bold; fill: #475569; font-size: 11px; }
    .q-title { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-weight: 700; font-size: 14px; }
    .q-desc { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-size: 11px; fill: #334155; }
    .q-example { font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; font-size: 11px; font-weight: 500; }
    .badge { font-family: system-ui, sans-serif; font-size: 9px; font-weight: bold; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="800" height="460" fill="url(#bg-grad)" rx="16"/>

  <!-- Header -->
  <text x="400" y="45" class="title">何时打开 Brainstorming：决策象限</text>
  <text x="400" y="70" class="subtitle">核心原则：返工代价越痛、目标越模糊，越应该使用 Brainstorming</text>

  <!-- Coordinates & Areas Group (Translated down to 135 to avoid overlaps with the header subtitle) -->
  <g transform="translate(100, 135)" filter="url(#shadow)">
    <!-- Quadrants BG -->
    <!-- Top-Left: Brainstorming (High Pain, Vague Target) -->
    <rect x="0" y="0" width="290" height="120" rx="8" fill="url(#q-green)" stroke="#10b981" stroke-opacity="0.8" stroke-width="1.5" />
    <!-- Top-Right: Double Check (High Pain, Clear Target) -->
    <rect x="310" y="0" width="290" height="120" rx="8" fill="url(#q-yellow)" stroke="#d97706" stroke-opacity="0.5" stroke-width="1" />
    <!-- Bottom-Left: Quick Iteration (Low Pain, Vague Target) -->
    <rect x="0" y="140" width="290" height="120" rx="8" fill="url(#q-purple)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <!-- Bottom-Right: Direct Coding (Low Pain, Clear Target) -->
    <rect x="310" y="140" width="290" height="120" rx="8" fill="url(#q-blue)" stroke="#3b82f6" stroke-opacity="0.8" stroke-width="1.5" />

    <!-- Center Axes -->
    <!-- Y-axis (Redo Pain) -->
    <line x1="300" y1="-20" x2="300" y2="280" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="300,-25 296,-15 304,-15" fill="#94a3b8" />
    <!-- X-axis (Target Clarity) -->
    <line x1="-20" y1="130" x2="620" y2="130" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="625,130 615,126 615,134" fill="#94a3b8" />

    <!-- Y-axis Labels (Positioned safely at the very ends of the axis line, now with no overlaps) -->
    <text x="300" y="-35" class="axis-arrow-text" text-anchor="middle" dominant-baseline="central">返工痛苦度高 (High Cost)</text>
    <text x="300" y="295" class="axis-arrow-text" text-anchor="middle" dominant-baseline="central">返工极其轻松 (Low Cost)</text>

    <!-- X-axis Labels (Positioned safely at the very ends of the axis line) -->
    <text x="-30" y="130" class="axis-arrow-text" text-anchor="end" dominant-baseline="central">需求模糊 (Vague)</text>
    <text x="635" y="130" class="axis-arrow-text" text-anchor="start" dominant-baseline="central">需求明确 (Clear)</text>

    <!-- Quadrant Texts -->
    <!-- Top-Left (Brainstorming Gold Zone) -->
    <g transform="translate(15, 12)">
      <rect x="0" y="0" width="130" height="18" rx="3" fill="#10b981" />
      <text x="65" y="9" class="badge" text-anchor="middle" dominant-baseline="central">Brainstorming 黄金区</text>
      <text x="0" y="38" class="q-title" fill="#047857" dominant-baseline="central">🎯 模糊 ＆ 高返工成本</text>
      <text x="0" y="63" class="q-desc" dominant-baseline="central">想法还不清晰，做错了得花几小时甚至几天改。</text>
      <text x="0" y="88" class="q-example" fill="#0f766e" dominant-baseline="central">★ 场景：数据库设计、核心架构、文章大方向</text>
    </g>

    <!-- Top-Right (Double Check Zone) -->
    <g transform="translate(325, 12)">
      <rect x="0" y="0" width="90" height="18" rx="3" fill="#d97706" />
      <text x="45" y="9" class="badge" text-anchor="middle" dominant-baseline="central">双重验证区</text>
      <text x="0" y="38" class="q-title" fill="#b45309" dominant-baseline="central">✓ 明确 ＆ 高返工成本</text>
      <text x="0" y="63" class="q-desc" dominant-baseline="central">虽然需求很具体，但影响面广，改动很危险。</text>
      <text x="0" y="88" class="q-example" fill="#92400e" dominant-baseline="central">★ 场景：生产环境部署、敏感重构、旧接口改动</text>
    </g>

    <!-- Bottom-Left (Quick Iteration Zone) -->
    <g transform="translate(15, 152)">
      <rect x="0" y="0" width="90" height="18" rx="3" fill="#a855f7" />
      <text x="45" y="9" class="badge" text-anchor="middle" dominant-baseline="central">快速迭代区</text>
      <text x="0" y="38" class="q-title" fill="#6b21a8" dominant-baseline="central">⚙ 模糊 ＆ 低返工成本</text>
      <text x="0" y="63" class="q-desc" dominant-baseline="central">想法虽然模糊，但试错成本极低，适合边写边看。</text>
      <text x="0" y="88" class="q-example" fill="#701a75" dominant-baseline="central">★ 场景：做原型 Demo、写草稿、实验性功能样式</text>
    </g>

    <!-- Bottom-Right (Direct Coding Zone) -->
    <g transform="translate(325, 152)">
      <rect x="0" y="0" width="90" height="18" rx="3" fill="#3b82f6" />
      <text x="45" y="9" class="badge" text-anchor="middle" dominant-baseline="central">直接动手区</text>
      <text x="0" y="38" class="q-title" fill="#1d4ed8" dominant-baseline="central">⚡ 明确 ＆ 低返工成本</text>
      <text x="0" y="63" class="q-desc" dominant-baseline="central">目标极度明确，做完觉得不好花一分钟就能改。</text>
      <text x="0" y="88" class="q-example" fill="#1e40af" dominant-baseline="central">★ 场景：修改拼写、调整字号颜色、简单 Bug 修复</text>
    </g>
  </g>
</svg>
